<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3b4a">
<title>مجموعات البحث | Sure In Bayane</title>
<style>
:root{--navy:#0b3b4a;--teal:#0e7c86;--ink:#12313e;--muted:#607783;--line:#d8e5e8;--soft:#f1f8f7;--paper:#fff;--red:#a33232}*{box-sizing:border-box}body{margin:0;background:#f6faf9;color:var(--ink);font:15px/1.65 system-ui,Tahoma,Arial,sans-serif}header{background:var(--navy);color:white;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}header a{color:white;text-decoration:none}header strong{font-size:20px}main{max-width:1120px;margin:26px auto;padding:0 16px}.hero,.panel,.card,.group-card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #0b3b4a08}.hero{background:linear-gradient(130deg,#eaf7f5,#fff);margin-bottom:18px}.hero h1{margin:0;color:var(--navy);font-size:clamp(25px,4vw,36px)}.muted{color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;color:var(--ink)}input,textarea,select{width:100%}textarea{min-height:90px;resize:vertical}button{cursor:pointer}button.primary{background:var(--teal);border-color:var(--teal);color:white;font-weight:650}button.ghost{background:var(--soft)}button.danger{color:var(--red)}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;margin:16px 0}.group-card{display:flex;flex-direction:column;gap:10px}.group-card h3{margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:var(--navy);color:white}.hidden{display:none!important}.panel{margin-top:16px}.panel h2{margin:0 0 12px}.item{padding:13px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item h3{margin:0 0 4px;font-size:17px}.item p{margin:5px 0}.badge{display:inline-block;padding:2px 9px;border-radius:30px;background:#e8f5f2;color:#17645d;font-size:12px}.badge.pending{background:#fff3d9;color:#8a5a00}.status{padding:10px 12px;background:var(--soft);border-radius:10px;margin:12px 0}.status.error{background:#fff0ef;color:#912d2d}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.filelink{word-break:break-all;color:var(--teal)}footer{text-align:center;color:var(--muted);padding:30px 12px}@media(max-width:650px){.split{grid-template-columns:1fr}header{padding:14px 16px}main{margin:16px auto}}
</style>
</head>
<body>
<header><div><strong>Sure In Bayane</strong><div class="small">مساحة التعاون العلمي</div></div><nav class="row" style="flex:0 1 auto"><a href="index.html">الرئيسية</a><a href="admin.html">الإدارة</a></nav></header>
<main>
<section class="hero"><div class="topline"><div><h1>مجموعات البحث العلمي</h1><p class="muted">أنشئ فريقاً بحثياً، ناقش الأفكار، شارك الملفات، وزّع المهام وتابع تقدم المشروع في مكان واحد.</p></div><span class="badge">مساحة خاصة بالأعضاء</span></div><div id="authStatus" class="status">جارٍ التحقق من تسجيل الدخول…</div></section>
<section id="app" class="hidden">
 <div class="topline"><h2>مجموعاتي</h2><button id="newGroupBtn" class="primary fit">+ إنشاء مجموعة</button></div>
 <form id="newGroupForm" class="panel hidden"><h3>مجموعة جديدة</h3><div class="split"><div class="field"><label for="groupTitle">اسم المجموعة</label><input id="groupTitle" maxlength="120" required></div><div class="field"><label for="groupVisibility">الخصوصية</label><select id="groupVisibility"><option value="private">خاصة بالدعوات</option><option value="public">عامة قابلة للانضمام</option></select></div></div><div class="field"><label for="groupDesc">وصف وأهداف المجموعة</label><textarea id="groupDesc" maxlength="1000"></textarea></div><div class="actions"><button class="primary">إنشاء</button><button type="button" id="cancelNewGroup" class="ghost">إلغاء</button></div></form>
 <div id="invitesList"></div><div id="groupsList" class="grid"></div>
 <section id="workspace" class="panel hidden"><div class="topline"><div><h2 id="activeTitle">المجموعة</h2><div id="activeDesc" class="muted small"></div></div><button id="refreshBtn" class="ghost fit">تحديث</button></div>
  <div class="tabs" id="tabs"><button data-tab="discussion" class="active">النقاش</button><button data-tab="members">الأعضاء</button><button data-tab="files">الملفات</button><button data-tab="references">مكتبة المراجع</button><button data-tab="meetings">الاجتماعات</button><button data-tab="tasks">المهام</button><button data-tab="audit">سجل النشاط</button></div>
  <div id="panelBody"></div>
 </section>
</section>
</main><footer>Sure In Bayane · تعاون علمي مسؤول وآمن</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{
 'use strict';
 const SUPABASE_URL=window.BAYANE_SUPABASE_URL||'https://dysugrfetryiygkrrxcy.supabase.co';
 const SUPABASE_KEY=window.BAYANE_SUPABASE_ANON_KEY||'sb_publishable_1sFkhrREpdZjNiulfGFYSw_btI_QJCN';
 const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const $=id=>document.getElementById(id); const state={user:null,groups:[],memberGroupIds:[],active:null,tab:'discussion',channel:null};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=s=>s?new Date(s).toLocaleString('ar-MA',{dateStyle:'medium',timeStyle:'short'}):'';
 async function profileMap(ids){const unique=[...new Set((ids||[]).filter(Boolean))];if(!unique.length)return {};const {data}=await sb.from('profiles').select('id,full_name,avatar_url,university,specialty').in('id',unique);return Object.fromEntries((data||[]).map(p=>[p.id,p]));}
 function status(msg,error=false){$('authStatus').textContent=msg;$('authStatus').classList.toggle('error',error)}
 function notice(msg,error=false){$('panelBody').insertAdjacentHTML('afterbegin',`<div class="status ${error?'error':''}">${esc(msg)}</div>`)}
 function requireUser(){if(!state.user){status('خاصك تسجل الدخول من الصفحة الرئيسية أولاً.',true);return false}return true}
 async function loadGroups(){const {data,error}=await sb.from('research_groups').select('id,title,description,visibility,created_at,created_by').order('created_at',{ascending:false});if(error){$('groupsList').innerHTML='<div class="empty">تعذر تحميل المجموعات. نفّذ ملف SQL وتأكد من سياسات RLS.</div>';return}state.groups=data||[];const {data:mem}=await sb.from('research_group_members').select('group_id').eq('user_id',state.user.id).eq('status','accepted');state.memberGroupIds=(mem||[]).map(x=>x.group_id);await renderInvites();renderGroups()}
 async function renderInvites(){const box=$('invitesList');const {data:invites,error}=await sb.from('research_group_members').select('id,group_id,role,created_at').eq('user_id',state.user.id).eq('status','pending');if(error){box.innerHTML='';return}const ids=(invites||[]).map(x=>x.group_id);if(!ids.length){box.innerHTML='';return}const {data:groups}=await sb.from('research_groups').select('id,title,description').in('id',ids);const gm=Object.fromEntries((groups||[]).map(g=>[g.id,g]));box.innerHTML=`<section class="panel"><h3>دعوات في انتظارك</h3>${invites.map(i=>`<div class="item"><b>${esc(gm[i.group_id]?.title||'مجموعة بحثية')}</b><div class="actions"><button class="primary fit" data-invite-accept="${i.id}">قبول الدعوة</button><button class="ghost fit" data-invite-decline="${i.id}">رفض</button></div></div>`).join('')}</section>`;box.querySelectorAll('[data-invite-accept]').forEach(b=>b.onclick=async()=>{const {error:er}=await sb.from('research_group_members').update({status:'accepted'}).eq('id',b.dataset.inviteAccept).eq('user_id',state.user.id);if(er)status(er.message,true);else{status('تم قبول الدعوة.');await loadGroups()}});box.querySelectorAll('[data-invite-decline]').forEach(b=>b.onclick=async()=>{const {error:er}=await sb.from('research_group_members').update({status:'declined'}).eq('id',b.dataset.inviteDecline).eq('user_id',state.user.id);if(er)status(er.message,true);else await loadGroups()})}
 function renderGroups(){const box=$('groupsList');if(!state.groups.length){box.innerHTML='<div class="empty">مازال ما عندك حتى مجموعة. أنشئ مجموعة أو اطلب دعوة من صاحب مجموعة.</div>';return}box.innerHTML=state.groups.map(g=>{const member=state.memberGroupIds.includes(g.id);return `<article class="group-card"><div class="topline"><h3>${esc(g.title)}</h3><span class="badge">${g.visibility==='public'?'عامة':'خاصة'}</span></div><p class="muted">${esc(g.description||'بدون وصف')}</p><div class="small muted">تاريخ الإنشاء: ${fmt(g.created_at)}</div>${member?`<button class="primary" data-open="${g.id}">فتح مساحة العمل</button>`:g.visibility==='public'?`<button class="ghost" data-join="${g.id}">طلب الانضمام</button>`:''}</article>`}).join('');box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGroup(b.dataset.open));box.querySelectorAll('[data-join]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('research_group_members').insert({group_id:b.dataset.join,user_id:state.user.id,role:'member',status:'pending',invited_by:state.user.id});if(error)status('تعذر إرسال طلب الانضمام: '+error.message,true);else{status('تم إرسال طلب الانضمام إلى مسؤول المجموعة.');await loadGroups()}})}
 async function openGroup(id){const g=state.groups.find(x=>x.id===id);if(!g||!state.memberGroupIds.includes(id)){status('خاصك تكون عضواً مقبولاً لفتح مساحة العمل.',true);return}state.active=id;$('workspace').classList.remove('hidden');$('activeTitle').textContent=g.title;$('activeDesc').textContent=g.description||'';await renderTab(state.tab);}
 async function renderTab(tab){state.tab=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const body=$('panelBody');body.innerHTML='<div class="status">جارٍ التحميل…</div>';if(!state.active)return;
  if(tab==='discussion')return renderDiscussion();if(tab==='members')return renderMembers();if(tab==='files')return renderFiles();if(tab==='references')return renderReferences();if(tab==='meetings')return renderMeetings();if(tab==='tasks')return renderTasks();if(tab==='audit')return renderAudit();
 }
 async function renderDiscussion(){const {data,error}=await sb.from('group_messages').select('id,user_id,body,created_at').eq('group_id',state.active).order('created_at',{ascending:true}).limit(150);if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل النقاش. تحقق من تنفيذ SQL.</div>';return}const rows=data||[];const pm=await profileMap(rows.map(x=>x.user_id));$('panelBody').innerHTML=`<div id="messages">${rows.map(m=>`<div class="item"><b>${esc(pm[m.user_id]?.full_name||'باحث')}</b><div>${esc(m.body)}</div><div class="small muted">${fmt(m.created_at)}</div></div>`).join('')||'<div class="empty">ابدأ أول نقاش علمي في المجموعة.</div>'}</div><form id="messageForm" class="field"><label for="messageText">رسالة جديدة</label><textarea id="messageText" maxlength="5000" required placeholder="شارك فكرة أو سؤالاً بحثياً…"></textarea><button class="primary">إرسال الرسالة</button></form>`;const form=$('messageForm');form.onsubmit=async e=>{e.preventDefault();const body=$('messageText').value.trim();if(!body)return;const {error}=await sb.from('group_messages').insert({group_id:state.active,user_id:state.user.id,body});if(error){notice('تعذر إرسال الرسالة: '+error.message,true);return}await renderDiscussion()};subscribeMessages()}
 function subscribeMessages(){if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('group-'+state.active).on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages',filter:'group_id=eq.'+state.active},()=>{if(state.tab==='discussion')renderDiscussion()}).subscribe()}
 async function renderMembers(){const {data,error}=await sb.from('research_group_members').select('id,user_id,role,status,created_at').eq('group_id',state.active).order('created_at');if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل الأعضاء.</div>';return}const rows=data||[];const pm=await profileMap(rows.map(x=>x.user_id));const mine=rows.find(x=>x.user_id===state.user.id);$('panelBody').innerHTML=`<p class="muted small">أرسل دعوة باستعمال معرّف الباحث UUID من ملفه الشخصي أو دليل الباحثين. لا تشارك البريد الإلكتروني علناً.</p>${mine?.role==='owner'||mine?.role==='admin'?`<form id="inviteForm" class="row field"><input id="inviteId" placeholder="معرّف الباحث UUID" required><select id="inviteRole" class="fit"><option value="member">عضو</option><option value="reviewer">مراجع</option></select><button class="primary fit">دعوة</button></form>`:''}<div>${rows.map(m=>`<div class="item"><b>${esc(pm[m.user_id]?.full_name||'باحث')}</b> <span class="badge ${m.status==='pending'?'pending':''}">${m.status==='pending'?'دعوة معلقة':'عضو نشط'}</span><div class="small muted">${esc(pm[m.user_id]?.university||'')} ${pm[m.user_id]?.specialty?'· '+esc(pm[m.user_id].specialty):''} · ${esc(m.role)}</div>${m.status==='pending'&&(m.user_id===state.user.id||['owner','admin'].includes(mine?.role))?`<button data-accept="${m.id}" class="primary fit">${m.user_id===state.user.id?'قبول الدعوة':'قبول طلب الانضمام'}</button>`:''}${mine?.role==='owner'&&m.user_id!==state.user.id&&m.status==='accepted'?`<button data-remove="${m.id}" class="danger ghost fit">إزالة العضو</button>`:''}</div>`).join('')||'<div class="empty">لا يوجد أعضاء بعد.</div>'}</div>`;
  if($('inviteForm'))$('inviteForm').onsubmit=async e=>{e.preventDefault();const uid=$('inviteId').value.trim();const role=$('inviteRole').value;const {error}=await sb.from('research_group_members').insert({group_id:state.active,user_id:uid,role,status:'pending',invited_by:state.user.id});if(error){notice('لم تنجح الدعوة. تأكد من UUID وأن الباحث غير مدعو مسبقاً. '+error.message,true);return}await log('invite_member','دعوة عضو جديد');await renderMembers()};
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('research_group_members').update({status:'accepted'}).eq('id',b.dataset.accept);if(error)notice(error.message,true);else{await log('accept_invitation','قبول الدعوة');await loadGroups();await renderMembers()}});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('إزالة هذا العضو من المجموعة؟'))return;const {error}=await sb.from('research_group_members').delete().eq('id',b.dataset.remove);if(error)notice(error.message,true);else{await log('remove_member','إزالة عضو');await renderMembers()}})
 }
 async function renderFiles(){const {data,error}=await sb.from('group_files').select('id,name,storage_path,description,uploaded_by,created_at').eq('group_id',state.active).order('created_at',{ascending:false});if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل الملفات.</div>';return}$('panelBody').innerHTML=`<form id="fileForm" class="field"><div class="split"><div><label>اختر ملفاً (حتى 15 MB)</label><input id="fileInput" type="file" required></div><div><label>وصف الملف</label><input id="fileDesc" maxlength="300" placeholder="مثلاً: بروتوكول البحث v1"></div></div><button class="primary">رفع الملف</button></form><div>${(data||[]).map(f=>`<div class="item"><b>${esc(f.name)}</b><p class="muted small">${esc(f.description||'')} · ${fmt(f.created_at)}</p><div class="actions"><button class="ghost" data-download="${f.id}">فتح / تحميل</button><button class="danger ghost" data-del-file="${f.id}" data-path="${esc(f.storage_path)}">حذف</button></div></div>`).join('')||'<div class="empty">لا توجد ملفات مشتركة بعد.</div>'}</div>`;
  $('fileForm').onsubmit=async e=>{e.preventDefault();const file=$('fileInput').files[0];if(!file)return;if(file.size>15*1024*1024){notice('الحد الأقصى لحجم الملف 15 MB.',true);return}const safe=file.name.replace(/[^\w.\-\u0600-\u06FF]/g,'_').slice(0,120);const path=state.active+'/'+crypto.randomUUID()+'-'+safe;const up=await sb.storage.from('group-files').upload(path,file,{upsert:false});if(up.error){notice('فشل رفع الملف: '+up.error.message,true);return}const ins=await sb.from('group_files').insert({group_id:state.active,name:file.name,storage_path:path,description:$('fileDesc').value.trim(),uploaded_by:state.user.id});if(ins.error){await sb.storage.from('group-files').remove([path]);notice(ins.error.message,true);return}await log('upload_file','رفع ملف مشترك');await renderFiles()};
  document.querySelectorAll('[data-download]').forEach(b=>b.onclick=async()=>{const f=(data||[]).find(x=>x.id===b.dataset.download);if(!f)return;const {data:d,error:er}=await sb.storage.from('group-files').createSignedUrl(f.storage_path,120);if(er)notice(er.message,true);else window.open(d.signedUrl,'_blank','noopener')});
  document.querySelectorAll('[data-del-file]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الملف؟'))return;const {error:er}=await sb.storage.from('group-files').remove([b.dataset.path]);if(er){notice(er.message,true);return}const del=await sb.from('group_files').delete().eq('id',b.dataset.delFile);if(del.error)notice(del.error.message,true);else{await log('delete_file','حذف ملف');await renderFiles()}})
 }
 async function renderReferences(){const {data,error}=await sb.from('group_references').select('id,title,doi_or_url,note,added_by,created_at').eq('group_id',state.active).order('created_at',{ascending:false});if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل مكتبة المراجع. نفّذ آخر نسخة من SQL migration.</div>';return}const pm=await profileMap((data||[]).map(x=>x.added_by));$('panelBody').innerHTML=`<form id="refForm" class="field"><label>عنوان المرجع</label><input id="refTitle" maxlength="300" required><label>DOI أو رابط المصدر</label><input id="refUrl" maxlength="500" placeholder="https://doi.org/... أو 10.xxxx/..."><label>ملاحظة للفريق</label><textarea id="refNote" maxlength="1000"></textarea><button class="primary">إضافة إلى مكتبة الفريق</button></form>${(data||[]).map(r=>{const u=r.doi_or_url?(r.doi_or_url.startsWith('10.')?'https://doi.org/'+r.doi_or_url:r.doi_or_url):'';const safe=/^https:\/\//i.test(u)?u:'';return `<div class="item"><b>${esc(r.title)}</b><p>${esc(r.note||'')}</p>${safe?`<a class="filelink" href="${esc(safe)}" target="_blank" rel="noopener">فتح المرجع</a>`:''}<div class="small muted">أضيف بواسطة ${esc(pm[r.added_by]?.full_name||'عضو')} · ${fmt(r.created_at)}</div><button class="danger ghost fit" data-ref-delete="${r.id}">حذف</button></div>`}).join('')||'<div class="empty">اجمعوا المراجع الأساسية للمشروع هنا، مع DOI أو رابط الناشر.</div>'}`;$('refForm').onsubmit=async e=>{e.preventDefault();const raw=$('refUrl').value.trim();let normalized=raw;if(raw&&!/^https:\/\//i.test(raw)&&!/^10\.\d{4,9}\//.test(raw)){notice('أدخل رابط HTTPS أو DOI يبدأ بـ 10.',true);return}const {error:er}=await sb.from('group_references').insert({group_id:state.active,title:$('refTitle').value.trim(),doi_or_url:normalized||null,note:$('refNote').value.trim(),added_by:state.user.id});if(er)notice(er.message,true);else{await log('add_reference','إضافة مرجع إلى مكتبة الفريق');await renderReferences()}};document.querySelectorAll('[data-ref-delete]').forEach(b=>b.onclick=async()=>{const {error:er}=await sb.from('group_references').delete().eq('id',b.dataset.refDelete);if(er)notice(er.message,true);else{await log('delete_reference','حذف مرجع');await renderReferences()}})}
 async function renderMeetings(){const {data,error}=await sb.from('group_meetings').select('*').eq('group_id',state.active).order('starts_at',{ascending:true});if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل الاجتماعات.</div>';return}$('panelBody').innerHTML=`<form id="meetingForm" class="field"><div class="split"><div><label>عنوان الاجتماع</label><input id="meetingTitle" maxlength="150" required></div><div><label>التاريخ والوقت</label><input id="meetingDate" type="datetime-local" required></div></div><label>رابط الاجتماع (اختياري)</label><input id="meetingUrl" type="url" placeholder="https://"><label>ملاحظات</label><textarea id="meetingNotes" maxlength="2000"></textarea><button class="primary">إضافة اجتماع</button></form>${(data||[]).map(m=>`<div class="item"><h3>${esc(m.title)}</h3><div class="muted small">${fmt(m.starts_at)}</div><p>${esc(m.notes||'')}</p>${m.meeting_url?`<a class="filelink" href="${esc(m.meeting_url)}" target="_blank" rel="noopener">فتح رابط الاجتماع</a>`:''}</div>`).join('')||'<div class="empty">لا توجد اجتماعات مجدولة.</div>'}`;$('meetingForm').onsubmit=async e=>{e.preventDefault();const url=$('meetingUrl').value.trim();if(url&&!/^https:\/\//i.test(url)){notice('استعمل رابط HTTPS صالحاً.',true);return}const {error:er}=await sb.from('group_meetings').insert({group_id:state.active,title:$('meetingTitle').value.trim(),starts_at:new Date($('meetingDate').value).toISOString(),meeting_url:url||null,notes:$('meetingNotes').value.trim(),created_by:state.user.id});if(er)notice(er.message,true);else{await log('create_meeting','إضافة اجتماع');await renderMeetings()}}}
 async function renderTasks(){const {data,error}=await sb.from('group_tasks').select('id,title,description,status,due_at,assigned_to,created_at').eq('group_id',state.active).order('created_at',{ascending:false});if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل المهام.</div>';return}const {data:members}=await sb.from('research_group_members').select('user_id').eq('group_id',state.active).eq('status','accepted');const pm=await profileMap([...(members||[]).map(x=>x.user_id),...(data||[]).map(x=>x.assigned_to)]);$('panelBody').innerHTML=`<form id="taskForm" class="field"><label>عنوان المهمة</label><input id="taskTitle" maxlength="180" required><label>التفاصيل</label><textarea id="taskDesc" maxlength="2000"></textarea><div class="split"><div><label>المسؤول</label><select id="taskAssignee"><option value="">بدون تعيين</option>${(members||[]).map(m=>`<option value="${m.user_id}">${esc(pm[m.user_id]?.full_name||'باحث')}</option>`).join('')}</select></div><div><label>موعد التسليم</label><input id="taskDue" type="date"></div></div><button class="primary">إضافة مهمة</button></form>${(data||[]).map(t=>`<div class="item"><div class="topline"><h3>${esc(t.title)}</h3><span class="badge">${esc(t.status)}</span></div><p>${esc(t.description||'')}</p><div class="small muted">المسؤول: ${esc(pm[t.assigned_to]?.full_name||'غير معين')} ${t.due_at?'· التسليم: '+esc(t.due_at):''}</div><div class="actions"><select data-task-status="${t.id}" class="fit"><option value="todo" ${t.status==='todo'?'selected':''}>قيد الانتظار</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>قيد الإنجاز</option><option value="done" ${t.status==='done'?'selected':''}>مكتملة</option></select><button class="danger ghost fit" data-task-delete="${t.id}">حذف</button></div></div>`).join('')||'<div class="empty">أضف أول مهمة للفريق.</div>'}`;$('taskForm').onsubmit=async e=>{e.preventDefault();const {error:er}=await sb.from('group_tasks').insert({group_id:state.active,title:$('taskTitle').value.trim(),description:$('taskDesc').value.trim(),assigned_to:$('taskAssignee').value||null,due_at:$('taskDue').value||null,created_by:state.user.id});if(er)notice(er.message,true);else{await log('create_task','إضافة مهمة');await renderTasks()}};document.querySelectorAll('[data-task-status]').forEach(s=>s.onchange=async()=>{const {error:er}=await sb.from('group_tasks').update({status:s.value}).eq('id',s.dataset.taskStatus);if(er)notice(er.message,true);else{await log('update_task','تغيير حالة مهمة');await renderTasks()}});document.querySelectorAll('[data-task-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف المهمة؟'))return;const {error:er}=await sb.from('group_tasks').delete().eq('id',b.dataset.taskDelete);if(er)notice(er.message,true);else{await log('delete_task','حذف مهمة');await renderTasks()}})}
 async function renderAudit(){const {data,error}=await sb.from('group_audit_logs').select('id,action,details,created_at,actor_id').eq('group_id',state.active).order('created_at',{ascending:false}).limit(100);if(error){$('panelBody').innerHTML='<div class="empty">تعذر تحميل سجل النشاط.</div>';return}const pm=await profileMap((data||[]).map(x=>x.actor_id));$('panelBody').innerHTML=(data||[]).map(x=>`<div class="item"><b>${esc(x.action)}</b><p>${esc(x.details||'')}</p><div class="small muted">${esc(pm[x.actor_id]?.full_name||'عضو')} · ${fmt(x.created_at)}</div></div>`).join('')||'<div class="empty">لا يوجد نشاط مسجل بعد.</div>'}
 async function log(action,details){await sb.from('group_audit_logs').insert({group_id:state.active,actor_id:state.user.id,action,details})}
 $('newGroupBtn').onclick=()=>$('newGroupForm').classList.toggle('hidden');$('cancelNewGroup').onclick=()=>$('newGroupForm').classList.add('hidden');$('newGroupForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await sb.from('research_groups').insert({title:$('groupTitle').value.trim(),description:$('groupDesc').value.trim(),visibility:$('groupVisibility').value,created_by:state.user.id}).select().single();if(error){status('تعذر إنشاء المجموعة: '+error.message,true);return}const m=await sb.from('research_group_members').insert({group_id:data.id,user_id:state.user.id,role:'owner',status:'accepted',invited_by:state.user.id});if(m.error){status('تم إنشاء المجموعة لكن تعذرت إضافة المالك. نفّذ SQL migration ثم راجع الصلاحيات.',true);return}state.active=data.id;await log('create_group','إنشاء مجموعة بحثية');$('newGroupForm').reset();$('newGroupForm').classList.add('hidden');await loadGroups();await openGroup(data.id)};
 $('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)renderTab(b.dataset.tab)};$('refreshBtn').onclick=()=>{loadGroups().then(()=>renderTab(state.tab))};
 async function init(){const {data:{session}}=await sb.auth.getSession();state.user=session?.user||null;if(!state.user){status('سجّل الدخول من الصفحة الرئيسية، ثم افتح مجموعات البحث.',true);return}status('تم تسجيل الدخول. جارٍ تحميل مجموعاتك…');$('app').classList.remove('hidden');await loadGroups();sb.auth.onAuthStateChange((_event,session)=>{state.user=session?.user||null;if(!state.user){$('app').classList.add('hidden');status('انتهت الجلسة. سجّل الدخول من الصفحة الرئيسية.',true)}})}
 window.addEventListener('beforeunload',()=>{if(state.channel)sb.removeChannel(state.channel)});init().catch(e=>status('حدث خطأ: '+e.message,true));
})();
</script>
